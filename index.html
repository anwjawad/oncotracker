<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منسّق الأورام</title>
  <meta name="theme-color" content="#1C2541">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="الأقسام">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 4c-3.3 0-5.5 2.6-5.5 5.6 0 4.6 5.5 11.9 5.5 11.9s5.5-7.3 5.5-11.9C21.5 6.6 19.3 4 16 4Z"/>
          <path d="M10.5 28 18 17M21.5 28 14 17"/>
        </svg>
        <div>
          <strong id="brand-name">منسّق الأورام</strong>
          <span id="brand-sub">قسم الأورام</span>
        </div>
      </div>
      <ul class="nav">
        <li><a href="#/today" data-route="today"><span class="label">اليوم</span></a></li>
        <li><a href="#/committee" data-route="committee"><span class="label">لجنة الحالات الجديدة</span> <b class="count" data-count="committee"></b></a></li>
        <li><a href="#/clinic" data-route="clinic"><span class="label">حجوزات ما بعد العيادة</span></a></li>
        <li><a href="#/followups" data-route="followups"><span class="label">المتابعات</span> <b class="count warn" data-count="followups"></b></a></li>
        <li><a href="#/patients" data-route="patients"><span class="label">المرضى</span></a></li>
        <li><a href="#/quality" data-route="quality"><span class="label">تصحيح البيانات</span> <b class="count" data-count="quality"></b></a></li>
        <li><a href="#/reports" data-route="reports"><span class="label">التقارير</span></a></li>
      </ul>
      <ul class="nav nav-foot">
        <li><a href="#/settings" data-route="settings"><span class="label">الإعدادات</span></a></li>
      </ul>
    </nav>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn rail-toggle" data-action="toggle-rail" aria-label="القائمة">
          <svg class="i" width="22" height="22" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="page-title">اليوم</h1>
        <div class="global-search">
          <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="global-search" type="search" placeholder="ابحث عن مريض بالاسم أو رقم الملف (Ctrl+K)" autocomplete="off" aria-label="بحث عن مريض">
          <div id="global-results" class="results" hidden></div>
        </div>
        <button id="lang-btn" class="btn btn-sm lang-btn" data-action="toggle-lang">EN</button>
        <button id="sync-pill" class="sync-pill" data-action="sync-now" title="مزامنة الآن">
          <span class="dot"></span><span class="label">جاري التحميل…</span>
        </button>
      </header>
      <div id="mode-banner" class="mode-banner" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <aside id="drawer" class="drawer" hidden aria-label="ملف المريض"></aside>
  <div id="drawer-scrim" class="scrim" hidden data-action="close-drawer"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
